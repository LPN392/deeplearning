<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识别记录 - 花知花卉智能识别系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9f6; }
        .hero-section {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.2)), url('https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            height: 120px;
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="hero-section relative">
        <nav class="flex justify-between items-center px-12 py-6 text-white">
            <div class="text-2xl font-bold flex items-center gap-2">
                <span class="text-3xl">🌸</span> <a href="/">花知花卉智能识别系统</a>
            </div>
            <div class="flex gap-8 text-lg font-medium">
                <a href="/" class="hover:text-green-200">首页识别</a>
                <a href="/gallery" class="hover:text-green-200">花卉图鉴</a>
                <a href="/history" class="border-b-2 border-white pb-1">识别记录</a>
            </div>
        </nav>
    </div>

    <!-- History Section -->
    <div class="max-w-6xl mx-auto my-12 px-4 shadow-sm bg-white p-8 rounded-2xl">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold flex items-center before:content-[''] before:inline-block before:w-1.5 before:h-6 before:bg-green-500 before:mr-3">我的识别记录</h2>
            <button onclick="clearHistory()" class="text-white bg-red-400 hover:bg-red-500 px-4 py-2 rounded-full text-sm flex items-center gap-1 transition-all">🗑️ 一键清空</button>
        </div>
        <div id="history-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            <!-- 记录将通过 JS 渲染 -->
        </div>
        <div id="no-history-msg" class="text-center text-gray-400 py-20 hidden">
            <div class="text-5xl mb-4 opacity-50">🥀</div>
            <p>暂无识别记录，快去首页上传照片吧！</p>
            <a href="/" class="text-green-600 font-bold mt-4 inline-block hover:underline">返回首页 ></a>
        </div>
    </div>

    <script>
        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('flowerHistory') || '[]');
            const container = document.getElementById('history-container');
            const noMsg = document.getElementById('no-history-msg');
            
            if(history.length === 0) {
                container.innerHTML = '';
                noMsg.classList.remove('hidden');
                return;
            }
            
            noMsg.classList.add('hidden');
            container.innerHTML = history.map(item => `
                <div class="bg-gray-50 rounded-xl p-3 shadow-md hover:shadow-lg transition flex flex-col items-center">
                    <img src="${item.img}" class="w-full h-32 object-cover rounded-lg mb-3">
                    <div class="font-bold text-green-700 text-lg line-clamp-1">${item.name}</div>
                    <div class="text-xs font-bold text-gray-500 mt-1">相似度: ${item.confidence}</div>
                    <div class="text-[10px] text-gray-300 mt-1">${item.time}</div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if(confirm("确定要清空所有识别图片和记录吗？此操作不可恢复。")) {
                localStorage.removeItem('flowerHistory');
                renderHistory();
            }
        }

        renderHistory();
    </script>
</body>
</html>
